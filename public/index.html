<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POS</title>
<style>
:root{--bg:#f4f5f2;--ink:#1c2420;--card:#fff;--line:#d9ddd6;--pri:#1f5c46;--acc:#b4531f;--mut:#667}
@media(prefers-color-scheme:dark){:root{--bg:#161a18;--ink:#e8ece9;--card:#202623;--line:#38413c;--pri:#4fae8b;--acc:#e08a55;--mut:#9aa}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
button{cursor:pointer;background:var(--pri);color:#fff;border:0}button.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}button.r{background:var(--acc)}button:focus-visible,input:focus-visible{outline:2px solid var(--acc)}
.top{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--pri);color:#fff}.top b{flex:1}.top img{height:32px}.top button{background:#0003}
.nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px}.nav button{background:var(--card);color:var(--ink);border:1px solid var(--line)}.nav button.on{background:var(--ink);color:var(--bg)}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--pri);color:#fff;display:flex;flex-direction:column;gap:10px;padding:16px 12px;position:sticky;top:0;height:100vh}
aside .brand{display:flex;gap:8px;align-items:center;padding:4px 6px 12px;border-bottom:1px solid #fff3}aside .brand img{height:34px;border-radius:4px}
aside nav{display:flex;flex-direction:column;gap:4px;flex:1;overflow:auto}aside nav button{background:transparent;color:#fff;text-align:left;width:100%}aside nav button:hover{background:#fff2}aside nav button.on{background:#fff3;font-weight:700}
aside .me{font-size:13px;border-top:1px solid #fff3;padding-top:10px}aside .me span{opacity:.75}aside .me button{background:#0003;width:100%;margin-top:8px}
main{padding:18px 22px 40px;max-width:1100px;width:100%}
.form label{display:grid;gap:4px;margin:10px 0;font-weight:600;max-width:460px}.form input,.form textarea{font-weight:400;width:100%}h3{margin:0 0 6px}
.acc{margin:6px 0}.acch{width:100%;display:flex;justify-content:space-between;text-align:left;font-weight:700;padding:12px}
@media(max-width:760px){.shell{grid-template-columns:1fr}aside{position:static;height:auto}aside nav{flex-direction:row;flex-wrap:wrap}aside nav button{width:auto}main{padding:12px}}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.tbl{font-size:28px;font-weight:700;padding:26px 0;text-align:center}.tbl.busy{background:var(--acc)}
table{border-collapse:collapse;width:100%}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}.wrap{overflow-x:auto}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.big{font-size:22px;font-weight:700}.mut{color:var(--mut)}.split{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}@media(max-width:720px){.split{grid-template-columns:1fr}}
.login{max-width:320px;margin:12vh auto;display:grid;gap:10px}#pr{display:none}
@media print{body>*:not(#pr){display:none!important}#pr{display:block;font:13px monospace;width:72mm;color:#000}#pr td{border:0;padding:1px}}
</style></head><body><div id="app"></div><div id="pr"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m=n=>Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
let S=JSON.parse(sessionStorage.getItem('s')||'null'),tab='',cart=[],tbl=null,ord=null,cat={},cur=null;
async function api(p,method='GET',body){const r=await fetch('/api/'+p,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(S?.token||'')},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok){if(r.status==403&&S){sessionStorage.clear();S=null;draw()}throw new Error(j.error||'Error')}return j}
const go=async f=>{try{await f()}catch(e){alert(e.message)}};
function printHTML(h){$('#pr').innerHTML=h;window.print()}
function head(o,title){const c=o.cfg||{};return `<div style="text-align:center">${c.logo?`<img src="${c.logo}" style="max-height:50px"><br>`:''}<b>${esc(c.name)}</b><br>${esc(c.address)}<br>${title}</div>Table ${o.table_no??o.table} Order #${o.id??o.order}<br>${new Date(o.time||Date.now()).toLocaleString()}<hr>`}
const lines=o=>`<table>${o.items.map(i=>`<tr><td>${i.qty}x ${esc(i.name)}${i.comp?' (comp)':''}</td><td align=right>${i.comp?0:m(i.price*i.qty)}</td></tr>`).join('')}</table><hr><table><tr><td>Subtotal</td><td align=right>${m(o.sub)}</td></tr>${o.disc?`<tr><td>Discount</td><td align=right>-${m(o.disc)}</td></tr>`:''}${o.sc?`<tr><td>Service</td><td align=right>${m(o.sc)}</td></tr>`:''}${o.cn?`<tr><td>Consumption</td><td align=right>${m(o.cn)}</td></tr>`:''}${o.vat?`<tr><td>VAT</td><td align=right>${m(o.vat)}</td></tr>`:''}<tr><td><b>TOTAL</b></td><td align=right><b>${m(o.total)}</b></td></tr></table>`;
const docket=d=>printHTML(head(d,'<b>KITCHEN DOCKET</b>')+`Waiter: ${esc(d.waiter)}<hr>`+d.items.map(i=>`${i.qty} x ${esc(i.name)}<br>`).join('')+(d.remark?`<hr>Remark: ${esc(d.remark)}`:''));
const bill=o=>printHTML(head(o,'<b>CUSTOMER BILL</b>')+lines(o)+'<hr><center>Thank you</center>');
const receipt=(o,pays)=>printHTML(head(o,'<b>RECEIPT</b>')+lines(o)+(pays?'<hr>Paid: '+pays+'<br>':'')+'<hr><center>Thank you</center>');

const icons={Dashboard:'▦',Inventory:'▤',Tracking:'◷',Report:'▥',Cashier:'₦',Users:'☺',Config:'⚙',Expenses:'−',Tables:'▣',Profile:'✎'};
function draw(){
  if(!S){$('#app').innerHTML=`<form class="login card" onsubmit="event.preventDefault();go(async()=>{const r=await api('login','POST',{username:u.value,password:p.value});S=r;sessionStorage.setItem('s',JSON.stringify(r));tab='';draw()})"><h2>Sign in</h2><input id="u" placeholder="Username" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password"><button>Sign in</button></form>`;return}
  const role=S.user.role,tabs=({admin:['Dashboard','Inventory','Tracking','Report','Cashier','Users','Config'],accountant:['Dashboard','Report','Expenses'],cashier:['Tracking','Cashier'],waiter:['Tables']}[role]).concat('Profile');
  if(!tabs.includes(tab))tab=tabs[0];
  $('#app').innerHTML=`<div class="shell"><aside><div class="brand">${S.cfg.logo?`<img src="${S.cfg.logo}" alt="">`:''}<b>${esc(S.cfg.name)}</b></div><nav>${tabs.map(t=>`<button class="${t==tab?'on':''}" onclick="tab='${t}';draw()">${icons[t]||'•'}&nbsp; ${t}</button>`).join('')}</nav><div class="me">${esc(S.user.name)}<br><span>${role}</span><button onclick="sessionStorage.clear();S=null;draw()">Sign out</button></div></aside><main id="main"></main></div>`;
  go(()=>views[tab]())
}
const mainEl=h=>$('#main').innerHTML=h;
const tbl_=(cols,rows)=>`<div class="wrap"><table><tr>${cols.map(c=>`<th>${esc(c.replace(/_/g,' '))}</th>`).join('')}</tr>${rows.map(r=>`<tr>${cols.map(c=>`<td>${typeof r[c]=='number'?m(r[c]):esc(r[c])}</td>`).join('')}</tr>`).join('')}</table></div>`;
const val=id=>document.getElementById(id).value;

const views={
async Dashboard(){const d=await api('dashboard'),k=(t,v)=>`<div class="card"><div class="mut">${t}</div><div class="big">${v}</div></div>`;
 mainEl(`<h2>Today</h2><div class="grid">${k('Total sales',m(d.sales))}${k('Paid orders',d.orders)}${k('Pending tables',d.pending)}${k('VAT',m(d.vat))}${k('Service charge',m(d.service))}${k('Consumption',m(d.consumption))}${k('Discounts',m(d.discount))}${k('Voided',m(d.voids))}${k('Complimentary',m(d.comp))}${k('Expenses',m(d.expenses))}${k('Debt outstanding',m(d.debt))}</div><div class="card"><b>Payments by method</b>${tbl_(['method','a'],d.byMethod)}</div><div class="card"><b>Low stock</b>${d.lowStock.length?tbl_(['name','qty','reorder'],d.lowStock):'<p class="mut">Nothing at reorder level.</p>'}</div>`)},

async Inventory(){cat=await api('catalog');
 mainEl(`<div class="card"><b>Category</b><div class="row"><input id="cn" placeholder="Category name"><button onclick="go(async()=>{await api('categories','POST',{name:val('cn')});views.Inventory()})">Add category</button></div><div class="row"><select id="sc">${cat.cats.map(c=>`<option value=${c.id}>${esc(c.name)}</option>`).join('')}</select><input id="sn" placeholder="Subcategory name"><button onclick="go(async()=>{await api('subs','POST',{cat_id:val('sc'),name:val('sn')});views.Inventory()})">Add subcategory</button></div></div>
 <div class="card"><b>Import menu (.xlsx)</b><p class="mut">Columns: Category, Subcategory, Product, Quantity, Cost Price, Selling Price, Expire Date, Reorder</p><input type="file" id="xf" accept=".xlsx,.xls"><button onclick="imp()">Import</button></div>
 <div class="card"><b>Store</b><div class="row"><select id="ps">${cat.subs.map(s=>`<option value=${s.id}>${esc(cat.cats.find(c=>c.id==s.cat_id)?.name)} / ${esc(s.name)}</option>`).join('')}</select><input id="pn" placeholder="Product"><input id="pq" type="number" placeholder="Qty" style="width:80px"><input id="pc" type="number" placeholder="Cost" style="width:90px"><input id="pp" type="number" placeholder="Price" style="width:90px"><input id="pe" type="date" title="Expire date (optional)"><input id="pr_" type="number" placeholder="Reorder" style="width:90px"><button onclick="saveP()">Save product</button></div>
 <div class="wrap"><table><tr><th>Product</th><th>Category</th><th>Qty</th><th>Cost</th><th>Price</th><th>Expires</th><th>Reorder</th><th></th></tr>${cat.products.map(p=>`<tr style="${p.qty<=p.reorder&&p.reorder?'color:var(--acc)':''}"><td>${esc(p.name)}</td><td>${esc(p.cat)} / ${esc(p.sub)}</td><td>${p.qty}</td><td>${m(p.cost)}</td><td>${m(p.price)}</td><td>${esc(p.expiry||'')}</td><td>${p.reorder}</td><td><button class="g" onclick="editP(${p.id})">Edit</button> <button class="r" onclick="go(async()=>{if(confirm('Delete from store?')){await api('products/${p.id}','DELETE');views.Inventory()}})">Delete</button></td></tr>`).join('')}</table></div></div>`)},

async Tracking(){const os=await api('pending'),tb=await api('all-tables');
 mainEl(`<h2>Pending sales</h2>${os.length?'':'<p class="mut">No pending tables.</p>'}${os.map(o=>`<div class="card"><div class="row"><b>Table ${o.table_no}</b><span class="mut">${esc(o.waiter)} · ${o.status}</span><span class="big" style="margin-left:auto">${m(o.total)}</span></div>
 <table>${o.items.map(i=>`<tr><td><input type="checkbox" class="ck${o.id}" value="${i.id}"></td><td>${i.qty}x ${esc(i.name)} ${i.status=='new'?'<i class="mut">(unconfirmed)</i>':''}${i.comp?' (comp)':''}</td><td>${m(i.price*i.qty)}</td><td><button class="r" onclick="vi(${i.id})">Void</button> <button class="g" onclick="cp(${i.id})">Comp</button></td></tr>`).join('')}</table>
 <div class="row"><button class="r" onclick="vo(${o.id})">Void all</button><button class="g" onclick="dc(${o.id})">Discount</button><input id="to${o.id}" placeholder="To table" type="number" style="width:100px"><button class="g" onclick="tr(${o.id},true)">Transfer ticked</button><button class="g" onclick="tr(${o.id},false)">Transfer all</button></div></div>`).join('')}`)},

async Report(){const dy=await api('day');window._rd=window._rd||dy.id;
 const R=[['daily','Daily report'],['sales','Sales analysis'],['discount','Discount'],['void','Voided items'],['storedelete','Store delete'],['flow','Inflow & outflow'],['comp','Complimentary'],['debtors','Debtors'],['vat','VAT & service charge']];
 window._rt=window._rt||'daily';const r=await api(`reports/${_rt}?day=${_rd}`);
 let body;if(r.summary){const s=r.summary;body=tbl_(['Item','Amount'],[['Sales',s.sales],['Orders',s.orders],['VAT',s.vat],['Service charge',s.service],['Consumption',s.consumption],['Discounts',s.discount],['Voids',s.voids],['Complimentary',s.comp],['Expenses',s.expenses],...s.byMethod.map(x=>['Paid by '+x.method,x.a])].map(x=>({Item:x[0],Amount:x[1]})))}else body=r.rows.length?tbl_(Object.keys(r.rows[0]),r.rows):'<p class="mut">No records.</p>';
 mainEl(`<div class="row"><select onchange="_rd=this.value;views.Report()">${dy.days.map(d=>`<option value=${d.id} ${d.id==_rd?'selected':''}>Day #${d.id} ${new Date(d.opened).toLocaleDateString()}${d.closed?'':' (open)'}</option>`).join('')}</select>${R.map(x=>`<button class="${x[0]==_rt?'':'g'}" onclick="_rt='${x[0]}';views.Report()">${x[1]}</button>`).join('')}<button class="g" onclick="window.print()">Print</button></div><div class="card">${body}</div>`.replace('window.print()',"printHTML(document.querySelector('.card').innerHTML)"))},

async Cashier(){const [db,os]=await Promise.all([api('debtors'),api('recent-orders')]);
 mainEl(`<div class="card"><b>Receive cash</b><div class="row"><input id="ra" type="number" placeholder="Amount"><input id="rn" placeholder="Note"><button onclick="go(async()=>{await api('inflow','POST',{amount:val('ra'),note:val('rn')});alert('Recorded');views.Cashier()})">Receive</button></div></div>
 <div class="card"><b>Record expense</b><div class="row"><input id="et" placeholder="Title"><input id="ea" type="number" placeholder="Amount"><button onclick="go(async()=>{await api('expenses','POST',{title:val('et'),amount:val('ea')});alert('Saved');views.Cashier()})">Save expense</button></div></div>
 <div class="card"><b>Debtors</b>${db.length?'':'<p class="mut">No outstanding debt.</p>'}${db.map(d=>`<div class="row">${esc(d.name)} owes ${m(d.amount-d.paid)}<input id="da${d.id}" type="number" placeholder="Amount" style="width:100px"><select id="dm${d.id}"><option>cash</option><option>transfer</option><option>pos</option></select><button onclick="go(async()=>{await api('debtors/${d.id}/clear','POST',{amount:val('da${d.id}'),method:val('dm${d.id}')});views.Cashier()})">Clear debt</button></div>`).join('')}</div>
 <div class="card"><b>Reprint (today's paid orders)</b>${os.map(o=>`<div class="row">Table ${o.table_no} · #${o.id} · ${m(o.total)}<button class="g" onclick="go(async()=>bill(await api('orders/${o.id}')))">Reprint bill</button><button class="g" onclick="go(async()=>receipt(await api('orders/${o.id}')))">Reprint receipt</button></div>`).join('')}</div>`)},

async Expenses(){mainEl(`<div class="card"><b>Record expense</b><div class="row"><input id="et" placeholder="Title"><input id="ea" type="number" placeholder="Amount"><button onclick="go(async()=>{await api('expenses','POST',{title:val('et'),amount:val('ea')});alert('Saved')})">Save expense</button></div></div>`)},

async Users(){const us=window._us=await api('users');window._uid=null;
 mainEl(`<div class="card"><b id="ft">New account</b><div class="row"><input id="un" placeholder="Full name"><input id="uu" placeholder="Username"><input id="up" placeholder="Password"><select id="ur"><option>waiter</option><option>cashier</option><option>accountant</option><option>admin</option></select><button id="us" onclick="saveU()">Create</button><button class="g" id="uc" style="display:none" onclick="views.Users()">Cancel</button></div></div>
 <div class="card">${us.map(u=>`<div class="row"><b>${esc(u.name)}</b> <span class="mut">${esc(u.username)} · ${u.role}</span>${u.role=='waiter'?`<input id="tb${u.id}" value="${u.tables.join(',')}" placeholder="Tables e.g. 1,2,3"><button class="g" onclick="go(async()=>{await api('users/${u.id}/tables','POST',{tables:val('tb${u.id}').split(',').map(x=>parseInt(x)).filter(x=>x>0)});alert('Tables assigned');views.Users()})">Assign tables</button>`:''}<span style="margin-left:auto"></span><button class="g" onclick="editU(${u.id})">Edit</button> <button class="r" onclick="go(async()=>{if(confirm('Delete user?')){await api('users/${u.id}','DELETE');views.Users()}})">Delete</button></div>`).join('')}</div>`)},
async Profile(){mainEl(`<h2>My profile</h2><div class="card form"><label>Full name<input id="mn" value="${esc(S.user.name)}"></label><label>New password (leave blank to keep)<input id="mp" type="password" autocomplete="new-password"></label><button onclick="go(async()=>{await api('me','POST',{name:val('mn'),password:val('mp')});S.user.name=val('mn');sessionStorage.setItem('s',JSON.stringify(S));alert('Profile updated');draw()})">Save profile</button></div>`)},
async Config(){const c=await api('config'),d=await api('day'),sw=(k,l)=>`<div class="row"><label style="width:150px"><input type="checkbox" id="${k}_on" ${c[k+'_on']=='1'?'checked':''}> ${l}</label><input id="${k}_rate" type="number" step="0.01" value="${c[k+'_rate']}" style="width:90px"> %</div>`;
 mainEl(`<h2>Configuration</h2><div class="card form"><h3>Business details</h3><label>Business name<input id="bn" value="${esc(c.name)}"></label><label>Address<textarea id="ba" rows="3">${esc(c.address)}</textarea></label><label>Business logo<input type="file" id="bl" accept="image/*"></label>${c.logo?`<div class="row"><img src="${c.logo}" height="60" alt="Logo"><button class="g" onclick="go(async()=>{await api('config','POST',{logo:''});S.cfg.logo='';sessionStorage.setItem('s',JSON.stringify(S));draw()})">Remove logo</button></div>`:''}</div>
 <div class="card"><h3>Charges</h3>${sw('vat','VAT')}${sw('service','Service charge')}${sw('cons','Consumption')}</div><button onclick="saveCfg()">Save configuration</button>
 <div class="card" style="margin-top:14px"><h3>Business day</h3><p>Day #${d.id} opened ${new Date(d.opened).toLocaleString()}</p><button class="r" onclick="go(async()=>{if(confirm('End this business day and start a fresh one?')){await api('day/end','POST');alert('New business day started');views.Config()}})">End business day</button></div>`)},
async Tables(){const ts=await api('my-tables');tbl=null;ord=null;
 mainEl(`<h2>My tables</h2>${ts.length?'':'<p class="mut">No tables assigned yet. Ask the admin.</p>'}<div class="grid">${ts.map(t=>`<button class="tbl ${t.busy?'busy':''}" onclick="openT(${t.no})">${t.no}</button>`).join('')}</div>`)}
};

// ---- admin helpers
const rd=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
const imp=()=>go(async()=>{const f=$('#xf').files[0];if(!f)throw new Error('Choose a file');const r=await api('import','POST',{data:(await rd(f)).split(',')[1]});alert(r.imported+' products imported');views.Inventory()});
const saveP=()=>go(async()=>{await api('products','POST',{id:window._pid,sub_id:val('ps'),name:val('pn'),qty:+val('pq'),cost:+val('pc'),price:+val('pp'),expiry:val('pe'),reorder:+val('pr_')});window._pid=null;views.Inventory()});
const editP=id=>{const p=cat.products.find(x=>x.id==id);_pid=id;ps.value=p.sub_id;pn.value=p.name;pq.value=p.qty;pc.value=p.cost;pp.value=p.price;pe.value=p.expiry||'';pr_.value=p.reorder;pn.focus()};
const saveU=()=>go(async()=>{const b={name:val('un'),username:val('uu'),password:val('up'),role:val('ur')};window._uid?await api('users/'+_uid,'PUT',b):await api('users','POST',b);views.Users()});
const editU=id=>{const u=_us.find(x=>x.id==id);_uid=id;ft.textContent='Edit account: '+u.name;un.value=u.name;uu.value=u.username;up.value='';up.placeholder='New password (blank = keep)';ur.value=u.role;us.textContent='Save changes';uc.style.display='';un.focus();scrollTo(0,0)};
const saveCfg=()=>go(async()=>{const b={vat_on:vat_on.checked?1:0,vat_rate:vat_rate.value,service_on:service_on.checked?1:0,service_rate:service_rate.value,cons_on:cons_on.checked?1:0,cons_rate:cons_rate.value,name:bn.value,address:ba.value};const f=$('#bl').files[0];if(f&&f.size>1e6)throw new Error('Logo must be under 1 MB');if(f)b.logo=await rd(f);await api('config','POST',b);S.cfg.name=bn.value;if(f)S.cfg.logo=b.logo;sessionStorage.setItem('s',JSON.stringify(S));alert('Saved');draw()});
const why=t=>prompt(t+' - reason?')??null;
const vi=id=>go(async()=>{const r=why('Void item');if(r===null)return;await api(`items/${id}/void`,'POST',{reason:r});views.Tracking()});
const cp=id=>go(async()=>{const r=why('Complimentary');if(r===null)return;await api(`items/${id}/comp`,'POST',{reason:r});views.Tracking()});
const vo=id=>go(async()=>{const r=why('Void all');if(r===null)return;await api(`orders/${id}/void`,'POST',{reason:r});views.Tracking()});
const dc=id=>go(async()=>{const a=prompt('Discount amount');if(!a)return;await api(`orders/${id}/discount`,'POST',{amount:a,reason:why('Discount')||''});views.Tracking()});
const tr=(id,some)=>go(async()=>{const ids=some?[...document.querySelectorAll('.ck'+id+':checked')].map(x=>+x.value):[];if(some&&!ids.length)throw new Error('Tick the items to transfer');await api(`orders/${id}/transfer`,'POST',{to:val('to'+id),itemIds:ids});views.Tracking()});

// ---- waiter flow
async function openT(no){tbl=no;cart=[];cur=null;cat=await api('catalog');ord=await api('orders/table/'+no);orderView()}
function orderView(){
 const q=(window._q||'').toLowerCase(),btn=p=>`<button class="g" style="text-align:left" ${p.qty<=0?'disabled':''} onclick="addC(${p.id})"><b>${esc(p.name)}</b><br>${m(p.price)}<br><span class="mut">${p.qty} left</span></button>`;
 const hasNew=ord?.items.some(i=>i.status=='new'),total=cart.reduce((a,c)=>a+c.price*c.qty,0);
 const left=q?`<div class="grid">${cat.products.filter(p=>p.name.toLowerCase().includes(q)).map(btn).join('')||'<p class="mut">No match.</p>'}</div>`:(cat.subs.map(s=>{const open=cur==s.id;return `<div class="acc"><button class="g acch" onclick="cur=${open?'null':s.id};orderView()"><span>${esc(s.name)}</span><span>${open?'▲':'▼'}</span></button>${open?`<div class="grid" style="margin-top:8px">${cat.products.filter(p=>p.sub_id==s.id).map(btn).join('')||'<p class="mut">No items.</p>'}</div>`:''}</div>`}).join('')||'<p class="mut">No subcategories yet.</p>');
 mainEl(`<div class="row"><button class="g" onclick="views.Tables()">Back to tables</button><h2 style="margin:0">Table ${tbl}</h2></div><div class="split"><div class="card"><input id="sq" placeholder="Search product" value="${esc(window._q||'')}" oninput="window._q=this.value;orderView();sq.focus();sq.setSelectionRange(99,99)" style="width:100%;margin-bottom:8px">${left}</div>
 <div class="card"><b>New items</b>${cart.map((c,i)=>`<div class="row">${esc(c.name)}<button class="g" onclick="cart[${i}].qty--;if(!cart[${i}].qty)cart.splice(${i},1);orderView()">−</button>${c.qty}<button class="g" onclick="cart[${i}].qty++;orderView()">+</button><span style="margin-left:auto">${m(c.price*c.qty)}</span></div>`).join('')||'<p class="mut">Nothing added.</p>'}<textarea id="rm" placeholder="Remark (optional)" style="width:100%"></textarea>${cart.length?`<button onclick="sendD()">Generate docket · ${m(total)}</button>`:''}
 ${ord?`<hr><b>On this table</b>${ord.items.map(i=>`<div class="row">${i.qty}x ${esc(i.name)} ${i.status=='new'?'<i class="mut">awaiting confirmation</i>':''}<span style="margin-left:auto">${m(i.price*i.qty)}</span></div>`).join('')}<div class="big">Total ${m(ord.total)}</div><div class="row">${hasNew?`<button onclick="conf()">Confirm order</button><button class="r" onclick="go(async()=>{await api('orders/${ord.id}/cancel-new','POST');openT(tbl)})">Cancel unconfirmed</button>`:`<button onclick="bl()">Print customer bill</button>`}${ord.status=='billed'?`<button class="r" onclick="payV()">Print receipt / payment</button>`:''}</div>`:''}</div></div>`)}
const addC=id=>{const p=cat.products.find(x=>x.id==id),c=cart.find(x=>x.id==id);c?c.qty++:cart.push({id,name:p.name,price:p.price,qty:1});orderView()};
const sendD=()=>go(async()=>{const r=await api('orders/add','POST',{table:tbl,items:cart.map(c=>({id:c.id,qty:c.qty})),remark:val('rm')});r.docket.cfg=r.order.cfg;docket(r.docket);cart=[];ord=r.order;orderView()});
const conf=()=>go(async()=>{await api(`orders/${ord.id}/confirm`,'POST');cat=await api('catalog');ord=await api('orders/table/'+tbl);orderView()});
const bl=()=>go(async()=>{const o=await api(`orders/${ord.id}/bill`,'POST');ord=o;bill(o);orderView()});
function payV(){const o=ord;mainEl(`<div class="card"><h2>Payment · Table ${tbl}</h2><div class="big">Total ${m(o.total)}</div><p class="mut">Split across any methods (for example cash and transfer, or POS and transfer).</p>
 ${['cash','transfer','pos'].map(k=>`<div class="row"><label style="width:90px">${k.toUpperCase()}</label><input id="p_${k}" type="number" step="0.01" placeholder="0" oninput="sumP()"></div>`).join('')}<div class="row"><label style="width:90px">Debt</label><input id="p_debt" type="number" step="0.01" placeholder="0" oninput="sumP()"><input id="p_dn" placeholder="Debtor name"></div><p id="ps_" class="mut"></p><div class="row"><button onclick="pay()">Confirm payment &amp; print receipt</button><button class="g" onclick="orderView()">Back</button></div></div>`)}
const sumP=()=>{const s=['cash','transfer','pos','debt'].reduce((a,k)=>a+(+val('p_'+k)||0),0);ps_.textContent='Entered '+m(s)+' of '+m(ord.total)};
const pay=()=>go(async()=>{const payments=['cash','transfer','pos'].map(k=>({method:k,amount:+val('p_'+k)||0})).filter(p=>p.amount>0),debt=+val('p_debt')||0;const o=await api(`orders/${ord.id}/pay`,'POST',{payments,debtor:debt?{name:val('p_dn'),amount:debt}:null});receipt(o,payments.map(p=>p.method+' '+m(p.amount)).concat(debt?['debt '+m(debt)]:[]).join(', '));views.Tables()});
draw();
</script></body></html>
